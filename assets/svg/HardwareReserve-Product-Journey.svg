<svg width="100%" height="260"
viewBox="0 0 900 260"
fill="none"
xmlns="http://www.w3.org/2000/svg">

<title>HardwareReserve Product Journey</title>

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="900" y2="260">
<stop stop-color="#070B16"/>
<stop offset="0.5" stop-color="#101827"/>
<stop offset="1" stop-color="#08111F"/>
</linearGradient>

<linearGradient id="route" x1="100" y1="0" x2="800" y2="0">
<stop stop-color="#38BDF8"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#3B82F6"/>
</linearGradient>

<radialGradient id="centerGlow">
<stop stop-color="#22D3EE" stop-opacity=".25"/>
<stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</radialGradient>

<pattern id="grid"
width="32"
height="32"
patternUnits="userSpaceOnUse">

<path d="M32 0H0V32"
stroke="#94A3B8"
stroke-opacity=".035"/>

</pattern>

<filter id="glow">
<feGaussianBlur stdDeviation="5"/>
</filter>


</defs>


<style>

.text{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

.mono{
font-family:ui-monospace,Menlo,monospace;
}


.line{
stroke-dasharray:900;
stroke-dashoffset:900;
animation:draw 2s forwards;
}


.node{
animation:pulse 3s infinite;
transform-origin:center;
}


.packet{
animation:travel 5s linear infinite;
}


@keyframes draw{
to{
stroke-dashoffset:0;
}
}


@keyframes pulse{

0%,100%{
opacity:.35;
transform:scale(.9)
}

50%{
opacity:1;
transform:scale(1.2)
}

}


@keyframes travel{

0%{
offset-distance:0%;
}

100%{
offset-distance:100%;
}

}


</style>



<!-- background -->

<rect width="900" height="260" rx="24"
fill="url(#bg)"/>

<rect width="900" height="260"
fill="url(#grid)"/>


<ellipse cx="470"
cy="130"
rx="260"
ry="120"
fill="url(#centerGlow)"/>



<!-- title -->

<circle cx="35" cy="30"
r="3"
fill="#22D3EE"/>

<text x="48"
y="33"
class="mono"
font-size="9"
fill="#64748B"
letter-spacing="1">

PRODUCT JOURNEY / RESERVATION FLOW

</text>


<text x="865"
y="33"
text-anchor="end"
class="mono"
font-size="8"
fill="#475569">

REQUEST → ALLOCATION

</text>



<!-- journey line -->


<path id="journey"
d="M120 130
C250 130 300 130 390 130
C520 130 600 130 780 130"
stroke="#334155"
stroke-width="10"
stroke-linecap="round"/>


<path
d="M120 130
C250 130 300 130 390 130
C520 130 600 130 780 130"
stroke="url(#route)"
stroke-width="2"
stroke-linecap="round"
class="line"/>




<!-- Step 1 -->


<g>

<circle cx="150"
cy="130"
r="22"
fill="#0D1728"
stroke="#38BDF8"/>

<circle cx="150"
cy="130"
r="7"
fill="#22D3EE"
class="node"/>


<text x="150"
y="88"
text-anchor="middle"
class="mono"
font-size="8"
fill="#38BDF8">

01 REQUEST

</text>


<text x="150"
y="174"
text-anchor="middle"
class="text"
font-size="11"
fill="#E2E8F0">

GPU Server

</text>


<text x="150"
y="188"
text-anchor="middle"
class="text"
font-size="8"
fill="#64748B">

User Need

</text>

</g>




<!-- Step 2 -->

<g>

<circle cx="330"
cy="130"
r="22"
fill="#0D1728"
stroke="#22D3EE"/>

<circle cx="330"
cy="130"
r="7"
fill="#22D3EE"
class="node"/>


<text x="330"
y="88"
text-anchor="middle"
class="mono"
font-size="8"
fill="#22D3EE">

02 MATCH

</text>


<text x="330"
y="174"
text-anchor="middle"
class="text"
font-size="11"
fill="#E2E8F0">

Availability

</text>


<text x="330"
y="188"
text-anchor="middle"
class="text"
font-size="8"
fill="#64748B">

Smart Check

</text>

</g>




<!-- Step 3 -->


<g>

<circle cx="510"
cy="130"
r="22"
fill="#0D1728"
stroke="#60A5FA"/>

<circle cx="510"
cy="130"
r="7"
fill="#60A5FA"
class="node"/>


<text x="510"
y="88"
text-anchor="middle"
class="mono"
font-size="8"
fill="#60A5FA">

03 RESERVE

</text>


<text x="510"
y="174"
text-anchor="middle"
class="text"
font-size="11"
fill="#E2E8F0">

Booking

</text>


<text x="510"
y="188"
text-anchor="middle"
class="text"
font-size="8"
fill="#64748B">

JWT · Checkout

</text>

</g>





<!-- Final server -->

<g>

<rect x="690"
y="78"
width="130"
height="104"
rx="18"
fill="#091422"
stroke="#22D3EE"
stroke-opacity=".6"/>


<text x="755"
y="103"
text-anchor="middle"
class="mono"
font-size="8"
fill="#64748B">

04 RUNNING

</text>


<!-- server -->

<rect x="720"
y="115"
width="70"
height="42"
rx="6"
fill="#0D1829"
stroke="#38BDF8"/>


<path d="M730 128H780M730 141H780"
stroke="#38BDF8"
stroke-opacity=".6"/>


<circle cx="740"
cy="128"
r="2"
fill="#22D3EE"/>

<circle cx="740"
cy="141"
r="2"
fill="#22D3EE"/>


<text x="755"
y="174"
text-anchor="middle"
class="text"
font-size="8"
fill="#94A3B8">

ALLOCATED

</text>


</g>




<!-- moving packet -->

<circle r="5"
fill="#E0F2FE"
class="packet">

<animateMotion
dur="5s"
repeatCount="indefinite">

<mpath href="#journey"/>

</animateMotion>

</circle>


<circle r="14"
fill="#22D3EE"
opacity=".15"
filter="url(#glow)"
class="packet">

<animateMotion
dur="5s"
repeatCount="indefinite">

<mpath href="#journey"/>

</animateMotion>

</circle>




<!-- footer -->


<text x="450"
y="230"
text-anchor="middle"
class="mono"
font-size="8"
fill="#475569"
letter-spacing="1">

FROM USER REQUEST TO READY-TO-USE COMPUTE RESOURCE

</text>



<rect x="1"
y="1"
width="898"
height="258"
rx="24"
stroke="#64748B"
stroke-opacity=".2"/>


</svg>
