<svg width="100%" height="280" viewBox="0 0 900 280"
xmlns="http://www.w3.org/2000/svg" fill="none">

<title>HardwareReserve Digital Ecosystem</title>

<defs>

<linearGradient id="bg" x1="0" y1="0" x2="900" y2="280">
<stop stop-color="#050816"/>
<stop offset=".5" stop-color="#0C1527"/>
<stop offset="1" stop-color="#07101E"/>
</linearGradient>

<radialGradient id="orb">
<stop stop-color="#22D3EE" stop-opacity=".25"/>
<stop offset=".45" stop-color="#38BDF8" stop-opacity=".08"/>
<stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
</radialGradient>

<linearGradient id="neon">
<stop stop-color="#38BDF8"/>
<stop offset=".5" stop-color="#22D3EE"/>
<stop offset="1" stop-color="#3B82F6"/>
</linearGradient>

<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="1" fill="#94A3B8" opacity=".08"/>
</pattern>

<filter id="blur">
<feGaussianBlur stdDeviation="6"/>
</filter>

</defs>


<style>

.t{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;
}

.m{
font-family:ui-monospace,Menlo,monospace;
}

.orbit{
animation:rotate 14s linear infinite;
transform-origin:center;
}

.reverse{
animation:rotateBack 18s linear infinite;
transform-origin:center;
}

.pulse{
animation:pulse 3s infinite;
transform-origin:center;
}

.data{
stroke-dasharray:10 14;
animation:data 2s linear infinite;
}

@keyframes rotate{
to{transform:rotate(360deg)}
}

@keyframes rotateBack{
to{transform:rotate(-360deg)}
}

@keyframes pulse{
0%,100%{opacity:.35;transform:scale(.8)}
50%{opacity:1;transform:scale(1.15)}
}

@keyframes data{
to{stroke-dashoffset:-48}
}

</style>


<!-- background -->

<rect width="900" height="280" rx="28" fill="url(#bg)"/>
<rect width="900" height="280" fill="url(#dots)"/>

<ellipse cx="450" cy="135"
rx="260" ry="130"
fill="url(#orb)"/>



<!-- header -->

<circle cx="35" cy="32" r="3" fill="#22D3EE"/>

<text x="48" y="35"
class="m"
font-size="9"
fill="#64748B"
letter-spacing="1">

HARDWARE RESERVE / DIGITAL ECOSYSTEM

</text>

<text x="865" y="35"
text-anchor="end"
class="m"
font-size="8"
fill="#475569">

CONNECT · MANAGE · RESERVE

</text>



<!-- orbit rings -->

<g class="orbit">

<ellipse cx="450" cy="140"
rx="260" ry="75"
stroke="#38BDF8"
stroke-opacity=".18"
stroke-dasharray="4 8"/>

<ellipse cx="450" cy="140"
rx="190" ry="55"
stroke="#22D3EE"
stroke-opacity=".2"
stroke-dasharray="3 9"/>

</g>


<g class="reverse">

<path d="M220 140
C300 30 600 30 680 140
C600 250 300 250 220 140Z"
stroke="#3B82F6"
stroke-opacity=".12"
stroke-dasharray="6 12"/>

</g>



<!-- center -->

<g>

<circle cx="450" cy="140"
r="78"
fill="#22D3EE"
opacity=".08"
filter="url(#blur)"
class="pulse"/>


<circle cx="450" cy="140"
r="55"
fill="#091523"
stroke="url(#neon)"
stroke-width="1.5"/>


<rect x="425" y="105"
width="50"
height="70"
rx="8"
fill="#0D1829"
stroke="#22D3EE"/>


<path d="M435 122H465M435 140H465M435 158H465"
stroke="#38BDF8"/>


<circle cx="442" cy="122"
r="3"
fill="#22D3EE"
class="pulse"/>


<text x="450" y="92"
text-anchor="middle"
class="m"
font-size="8"
fill="#64748B">

CORE PLATFORM

</text>


<text x="450" y="195"
text-anchor="middle"
class="t"
font-size="13"
fill="#F8FAFC">

HardwareReserve

</text>

</g>



<!-- ecosystem nodes -->

<g class="data"
stroke="url(#neon)"
stroke-width="1.5">

<path d="M390 100L260 70"/>
<path d="M510 100L640 70"/>

<path d="M390 180L260 210"/>
<path d="M510 180L640 210"/>

</g>



<!-- nodes -->

<g>

<!-- left top -->

<rect x="70" y="48"
width="190" height="55"
rx="12"
fill="#0D1728"
stroke="#334155"/>

<text x="90" y="70"
class="m"
font-size="8"
fill="#38BDF8">

01 / USERS

</text>

<text x="90" y="90"
class="t"
font-size="12"
fill="#E2E8F0">

Authentication

</text>


<!-- right top -->

<rect x="640" y="48"
width="190" height="55"
rx="12"
fill="#0D1728"
stroke="#334155"/>

<text x="660" y="70"
class="m"
font-size="8"
fill="#22D3EE">

02 / RESOURCES

</text>

<text x="660" y="90"
class="t"
font-size="12"
fill="#E2E8F0">

Server Catalog

</text>


<!-- left bottom -->

<rect x="70" y="177"
width="190" height="55"
rx="12"
fill="#0D1728"
stroke="#334155"/>

<text x="90" y="199"
class="m"
font-size="8"
fill="#60A5FA">

03 / BOOKINGS

</text>

<text x="90" y="219"
class="t"
font-size="12"
fill="#E2E8F0">

Smart Reservation

</text>



<!-- right bottom -->

<rect x="640" y="177"
width="190"
height="55"
rx="12"
fill="#0D1728"
stroke="#334155"/>

<text x="660" y="199"
class="m"
font-size="8"
fill="#38BDF8">

04 / INTELLIGENCE

</text>

<text x="660" y="219"
class="t"
font-size="12"
fill="#E2E8F0">

AI Support

</text>

</g>



<!-- floating particles -->

<g fill="#22D3EE">

<circle cx="310" cy="120" r="2" class="pulse"/>
<circle cx="590" cy="120" r="2" class="pulse"/>
<circle cx="330" cy="160" r="2" class="pulse"/>
<circle cx="570" cy="160" r="2" class="pulse"/>

</g>



<text x="450" y="258"
text-anchor="middle"
class="m"
font-size="8"
fill="#475569"
letter-spacing="1">

FULL STACK · REAL TIME · INTELLIGENT RESOURCE MANAGEMENT

</text>


<rect x="1" y="1"
width="898"
height="278"
rx="28"
stroke="#64748B"
stroke-opacity=".2"/>

</svg>
